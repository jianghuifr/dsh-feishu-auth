name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # 发布产物必须自洽：打包内容 + 真实发布命令（staged publishing）的 dry-run。
      - run: npm pack --dry-run
      - name: Ensure npm supports staged publishing
        run: npm install -g npm@latest
      # 用临时的预发布版本号做 dry-run：真实版本一旦发布，registry 会以
      # 「不能覆盖已发布版本」拒绝，那样每次发版后 CI 都会红，而这不是错误状态。
      # 预发布版本号必须显式带 --tag。
      - name: Verify the release command (dry run)
        run: |
          npm version --no-git-tag-version --force "0.0.0-ci-dryrun.$(date +%s)" >/dev/null
          npm stage publish --dry-run --tag ci-dryrun
